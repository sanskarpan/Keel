name: contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go and contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: keel-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_MIN_INSYNC_REPLICAS: 1
          KAFKA_NUM_PARTITIONS: 3
        ports:
          - 19092:19092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 release line, immutable commit
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 release line, immutable commit
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify authenticated Kafka TLS and rotation
        env:
          KEEL_TEST_KAFKA_IMAGE: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        run: bash scripts/test-kafka-secure.sh
      - name: Verify pinned malware scanner and extraction sandbox
        run: bash scripts/test-intake-sandbox.sh
      - name: Install forced-RLS fixture in PostgreSQL
        env:
          PGPASSWORD: keel-local-only
        run: >-
          docker run --rm --network host
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          --env PGPASSWORD
          --entrypoint psql
          pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -f /workspace/deploy/compose/init/20-keel-tenant-roles.sql
      - name: Enable pgvector extension in disposable PostgreSQL
        env:
          PGPASSWORD: keel-local-only
        run: >-
          docker run --rm --network host --env PGPASSWORD --entrypoint psql
          pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
          -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Create order-event Kafka topic
        run: >-
          docker run --rm --network host
          --entrypoint /opt/kafka/bin/kafka-topics.sh
          apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          --bootstrap-server 127.0.0.1:19092 --create --if-not-exists
          --topic keel.test.orders.v1 --partitions 3 --replication-factor 1
      - name: Create K1.7 fault-injection Kafka topics
        run: |
          docker run --rm --network host --entrypoint /opt/kafka/bin/kafka-topics.sh \
            apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837 \
            --bootstrap-server 127.0.0.1:19092 --create --if-not-exists \
            --topic keel.k17-relay.orders.v1 --partitions 3 --replication-factor 1
          docker run --rm --network host --entrypoint /opt/kafka/bin/kafka-topics.sh \
            apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837 \
            --bootstrap-server 127.0.0.1:19092 --create --if-not-exists \
            --topic keel.k17-consumer.orders.v1 --partitions 3 --replication-factor 1
      - name: Apply embedded PostgreSQL migrations
        env:
          KEEL_MIGRATION_DATABASE_URL: postgres://keel_local_migrator:keel-migrate-local-only@127.0.0.1:5432/postgres?sslmode=disable
        run: GOTOOLCHAIN=local go run ./cmd/keel migrate
      - name: Start isolated pinned Temporal development server
        run: |
          docker run --rm --network host --env PGPASSWORD=keel-local-only --entrypoint psql \
            pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE temporal LOGIN PASSWORD 'temporal-local-only';" \
            -c "CREATE DATABASE temporal OWNER temporal;" \
            -c "CREATE DATABASE temporal_visibility OWNER temporal;"
          postgres_container=$(docker ps --quiet --filter 'ancestor=pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11' | head -n 1)
          test -n "$postgres_container"
          service_network=$(docker inspect --format '{{range $name, $settings := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$postgres_container" | head -n 1)
          test -n "$service_network"
          docker run -d --name keel-contract-temporal --network "$service_network" --network-alias temporal \
            --publish 127.0.0.1:7233:7233 \
            -e DB=postgres12 -e DB_PORT=5432 -e DBNAME=temporal \
            -e POSTGRES_USER=temporal -e POSTGRES_PWD=temporal-local-only \
            -e POSTGRES_SEEDS=postgres -e VISIBILITY_DBNAME=temporal_visibility \
            -e SKIP_DB_CREATE=true -e TEMPORAL_ADDRESS=temporal:7233 \
            -e TEMPORAL_CLI_ADDRESS=temporal:7233 \
            -e NO_PROXY=localhost,127.0.0.1,::1,postgres,temporal -e no_proxy=localhost,127.0.0.1,::1,postgres,temporal \
            -e HTTP_PROXY= -e HTTPS_PROXY= -e http_proxy= -e https_proxy= \
            temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
          for attempt in $(seq 1 120); do
            if docker exec keel-contract-temporal temporal operator cluster health --address temporal:7233; then
              exit 0
            fi
            sleep 1
          done
          docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' keel-contract-temporal
          docker logs --tail 100 keel-contract-temporal
          exit 1
      - name: Validate contracts, tests, and static analysis
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel_local_app:keel-app-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_BUDGET_CONTROL_DATABASE_URL: postgres://keel_local_budget_control:keel-budget-control-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_AI_WORKER_DATABASE_URL: postgres://keel_local_ai_worker:keel-ai-worker-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_WORKER_DATABASE_URL: postgres://keel_local_worker:keel-worker-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_PROJECTOR_DATABASE_URL: postgres://keel_local_projector:keel-projector-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_OPERATOR_DATABASE_URL: postgres://keel_local_operator:keel-operator-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_FILE_PROCESSOR_DATABASE_URL: postgres://keel_local_file_processor:keel-file-processor-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_RETRIEVAL_INDEXER_DATABASE_URL: postgres://keel_local_retrieval_indexer:keel-retrieval-indexer-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_ADMIN_DATABASE_URL: postgres://postgres:keel-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_KAFKA_BROKERS: localhost:19092
          KEEL_TEST_KAFKA_TOPIC: keel.test.orders.v1
          KEEL_TEST_AGENT_PASSWORD: keel-agent-local-only
          KEEL_TEST_MIGRATION_DATABASE_URL: postgres://keel_local_migrator:keel-migrate-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: make check
      - name: Measure lexical retrieval under tenant skew
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel_local_app:keel-app-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_RETRIEVAL_INDEXER_DATABASE_URL: postgres://keel_local_retrieval_indexer:keel-retrieval-indexer-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_ADMIN_DATABASE_URL: postgres://postgres:keel-local-only@127.0.0.1:5432/postgres?sslmode=disable
        run: GOTOOLCHAIN=local go test -run '^TestPostgreSQL(LexicalPlanUsesPostingTermIdentity|BM25MatchesIndependentReferenceAcrossLengthsAndFrequencies|TenantVisibilityScopedLexicalPublication)$' -bench '^BenchmarkPostgreSQLSearchScoresTenantSkew$' -benchtime=100x -benchmem -v ./internal/retrieval/postgres
      - name: Validate immutable retrieval evaluation corpus
        run: GOTOOLCHAIN=local go run ./cmd/keel-corpus-lint research/retrieval/v1/corpus.json research/retrieval/v1/build-manifest.json research/retrieval/v1
      - name: Reproduce synthetic retrieval reference results
        run: |
          result_file=$(mktemp)
          GOTOOLCHAIN=local go run ./cmd/keel-corpus-eval research/retrieval/v1/corpus.json research/retrieval/v1/build-manifest.json "$result_file"
          cmp "$result_file" research/retrieval/v1/reference-results.json
      - name: Report supplier workflow history budget measurement
        env:
          KEEL_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
          KEEL_TEST_TEMPORAL_HISTORY_BUDGET: "1"
        run: GOTOOLCHAIN=local go test -v ./internal/supplier/caseworkflow -run TestTemporalHistoryBudgetReplayAndSimulated72HourRecovery -count=1
      - name: Race-check packages
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel_local_app:keel-app-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_BUDGET_CONTROL_DATABASE_URL: postgres://keel_local_budget_control:keel-budget-control-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_AI_WORKER_DATABASE_URL: postgres://keel_local_ai_worker:keel-ai-worker-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_WORKER_DATABASE_URL: postgres://keel_local_worker:keel-worker-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_PROJECTOR_DATABASE_URL: postgres://keel_local_projector:keel-projector-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_OPERATOR_DATABASE_URL: postgres://keel_local_operator:keel-operator-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_FILE_PROCESSOR_DATABASE_URL: postgres://keel_local_file_processor:keel-file-processor-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_RETRIEVAL_INDEXER_DATABASE_URL: postgres://keel_local_retrieval_indexer:keel-retrieval-indexer-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_ADMIN_DATABASE_URL: postgres://postgres:keel-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_KAFKA_BROKERS: localhost:19092
          KEEL_TEST_KAFKA_TOPIC: keel.test.orders.v1
          KEEL_TEST_AGENT_PASSWORD: keel-agent-local-only
          KEEL_TEST_MIGRATION_DATABASE_URL: postgres://keel_local_migrator:keel-migrate-local-only@127.0.0.1:5432/postgres?sslmode=disable
          KEEL_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: GOTOOLCHAIN=local go test -race ./...
      - name: Build all packages
        run: GOTOOLCHAIN=local go build ./...
      - name: Stop isolated Temporal test server
        if: always()
        run: docker rm --force keel-contract-temporal || true
