openapi: 3.1.1
info:
  title: Keel API
  version: 0.1.0
  summary: Initial health and order vertical-slice contract.
  description: >-
    Design contract for the initial Keel HTTP surface. A documented operation is
    not evidence that its runtime is implemented. Order operations are introduced
    in K1; SaaS and supplier workflows are added as their checklist issues ship.
servers:
  - url: /
    description: Deployment-provided API origin.
tags:
  - name: health
  - name: orders
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Report process liveness without probing dependencies.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Report whether this runtime role can accept its assigned work.
      responses:
        '200':
          description: All dependencies required for this role are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: This role cannot safely accept its assigned work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /health/startup:
    get:
      tags: [health]
      operationId: getStartup
      summary: Report whether startup configuration and role initialization completed.
      responses:
        '200':
          description: Startup state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Startup'
        '503':
          description: Role initialization has not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Startup'
  /version:
    get:
      tags: [health]
      operationId: getVersion
      summary: Report build and configuration identity without customer data.
      responses:
        '200':
          description: Non-secret build identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create a draft order under the authenticated tenant.
      description: Tenant identity is derived from current authorization, never accepted from this body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Draft order created or the canonical idempotent result.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-keel-phase: K1
  /v1/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Read an authorized order snapshot and projection watermark.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authorized order state.
          headers:
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/orders/{order_id}/submit:
    parameters:
      - $ref: '#/components/parameters/OrderID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [orders]
      operationId: submitOrder
      summary: Submit an order using optimistic concurrency and idempotency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Authoritative accepted order state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-keel-phase: K1
  /v1/orders/{order_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      tags: [orders]
      operationId: listOrderEvents
      summary: Read a bounded page of authorized immutable order events.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Event page and an opaque continuation cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEventPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per logical command; reusing a key with different content conflicts.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag returned for the current aggregate version.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  responses:
    Problem:
      description: Safe typed problem; detail excludes secrets and raw provider content.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: live }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, role, dependencies]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        role: { $ref: '#/components/schemas/RuntimeRole' }
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ready, degraded, unavailable]
    Startup:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [starting, complete, failed] }
    Version:
      type: object
      additionalProperties: false
      required: [service, role, version, schema_version]
      properties:
        service: { type: string, const: keel }
        role: { $ref: '#/components/schemas/RuntimeRole' }
        version: { type: string, minLength: 1, maxLength: 128 }
        source_sha: { type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$' }
        artifact_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        schema_version: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
    RuntimeRole:
      type: string
      enum: [api, relay, projector, ai-executor, temporal-worker, webhook-worker, billing-worker, notification-worker]
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [external_reference, supplier_id, currency, amount_minor, line_items]
      properties:
        external_reference: { type: string, minLength: 1, maxLength: 128 }
        supplier_id: { type: string, format: uuid }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Three uppercase letters; the server validates the supported ISO 4217 currency catalog before mutation.
        amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        line_items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [description, quantity]
            properties:
              description: { type: string, minLength: 1, maxLength: 500 }
              quantity:
                type: string
                maxLength: 32
                pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
                not:
                  pattern: '^0(\.0{1,6})?$'
        evidence:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [document_id, version]
            properties:
              document_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [evidence]
      properties:
        evidence:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [document_id, version]
            properties:
              document_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    Order:
      type: object
      additionalProperties: false
      required: [order_id, status, version, currency, amount_minor, projection_watermark]
      properties:
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, submitted, verifying, approved, rejected, canceled] }
        version: { type: integer, minimum: 1 }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Three uppercase letters; the server validates the supported ISO 4217 currency catalog before mutation.
        amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        projection_watermark: { type: integer, minimum: 0 }
        result_state: { type: string, enum: [accepted, queued, running, complete, failed] }
    OrderEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '../events/order-submitted.v1.schema.json'
        next_cursor: { type: string, minLength: 1, maxLength: 2048 }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1, maxLength: 128 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, minLength: 1, maxLength: 64 }
        detail: { type: string, maxLength: 1024 }
        request_id: { type: string, format: uuid }
        retry_after_seconds: { type: integer, minimum: 0, maximum: 86400 }
