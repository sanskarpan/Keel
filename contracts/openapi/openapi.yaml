openapi: 3.1.1
info:
  title: Keel API
  version: 0.1.0
  summary: Health, order, and supplier-intake vertical-slice contracts.
  description: >-
    Design contract for the initial Keel HTTP surface. A documented operation is
    not evidence that its runtime is implemented. Supplier operations are introduced
    in K2.1; authentication/runtime assembly and hosted-provider qualification remain
    separate gates before public customer traffic.
servers:
  - url: /
    description: Deployment-provided API origin.
tags:
  - name: health
  - name: orders
  - name: supplier intake
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Report process liveness without probing dependencies.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Report whether this runtime role can accept its assigned work.
      responses:
        '200':
          description: All dependencies required for this role are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: This role cannot safely accept its assigned work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /health/startup:
    get:
      tags: [health]
      operationId: getStartup
      summary: Report whether startup configuration and role initialization completed.
      responses:
        '200':
          description: Startup state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Startup'
        '503':
          description: Role initialization has not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Startup'
  /version:
    get:
      tags: [health]
      operationId: getVersion
      summary: Report build and configuration identity without customer data.
      responses:
        '200':
          description: Non-secret build identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create a draft order under the authenticated tenant.
      description: Tenant identity is derived from current authorization, never accepted from this body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Draft order created or the canonical idempotent result.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-keel-phase: K1
  /v1/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Read an authorized order snapshot and projection watermark.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authorized order state.
          headers:
            ETag:
              description: Strong validator for the full order representation; includes both command version and projection watermark.
              schema: { type: string, pattern: '^"[1-9][0-9]*-[0-9]+"$' }
            X-Order-Version:
              description: Authoritative command aggregate version for optimistic concurrency.
              schema: { type: string, pattern: '^[1-9][0-9]*$' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/orders/{order_id}/submit:
    parameters:
      - $ref: '#/components/parameters/OrderID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [orders]
      operationId: submitOrder
      summary: Submit an order using optimistic concurrency and idempotency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: Authoritative accepted order state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      x-keel-phase: K1
  /v1/orders/{order_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrderID'
    get:
      tags: [orders]
      operationId: listOrderEvents
      summary: Read a bounded page of authorized immutable order events.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Event page and an opaque continuation cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEventPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/supplier-invitations:
    post:
      tags: [supplier intake]
      operationId: issueSupplierInvitation
      summary: Issue a one-time supplier invitation for an authorized case.
      description: The invitation bearer is returned once with no-store headers; callers must deliver it through an approved private channel and must never write it to logs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueSupplierInvitationRequest'
      responses:
        '201':
          description: Invitation created; raw token is returned once.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueSupplierInvitationResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
      x-keel-phase: K2.1
  /v1/public/tenants/{tenant_id}/supplier-invitations/accept:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      tags: [supplier intake]
      operationId: acceptSupplierInvitation
      summary: Consume a single-use invitation and create a short-lived upload session.
      security:
        - supplierInviteBearer: []
      responses:
        '201':
          description: Invitation accepted and upload-session bearer issued once.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptSupplierInvitationResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
      x-keel-phase: K2.1
  /v1/public/tenants/{tenant_id}/supplier-upload-sessions/uploads:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      tags: [supplier intake]
      operationId: createSupplierUpload
      summary: Create a bounded quarantined upload reservation.
      security:
        - supplierSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierUploadRequest'
      responses:
        '201':
          description: Upload reservation and short-lived content capability created.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSupplierUploadResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
      x-keel-phase: K2.1
  /v1/public/tenants/{tenant_id}/supplier-uploads/{upload_id}/content:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UploadID'
    put:
      tags: [supplier intake]
      operationId: uploadSupplierContent
      summary: Stream content into quarantine using the one-upload capability.
      security:
        - uploadCapabilityBearer: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Verified bytes are quarantined and queued for scanning. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
      x-keel-phase: K2.1
  /v1/public/tenants/{tenant_id}/supplier-uploads/{upload_id}/capability:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UploadID'
    post:
      tags: [supplier intake]
      operationId: renewSupplierUploadCapability
      summary: Replace an unexpired or expired content capability for an awaiting upload.
      security:
        - supplierSessionBearer: []
      responses:
        '200':
          description: New upload capability; older capabilities are invalidated.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewSupplierUploadCapabilityResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
      x-keel-phase: K2.1
  /v1/public/tenants/{tenant_id}/supplier-uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UploadID'
    get:
      tags: [supplier intake]
      operationId: getSupplierUploadStatus
      summary: Read a coarse status for an upload owned by the supplier session.
      security:
        - supplierSessionBearer: []
      responses:
        '200':
          description: Upload status without scanner details or extracted evidence content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierUploadStatus'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
      x-keel-phase: K2.1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    supplierInviteBearer:
      type: http
      scheme: bearer
      description: Single-use, tenant-scoped opaque invitation secret.
    supplierSessionBearer:
      type: http
      scheme: bearer
      description: Short-lived supplier upload-session secret.
    uploadCapabilityBearer:
      type: http
      scheme: bearer
      description: One-upload capability bound to the exact tenant, upload, size and checksum.
  parameters:
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenant_id
      in: path
      required: true
      description: Tenant selector only; bearer capability/session authorization and database RLS still validate access.
      schema: { type: string, format: uuid }
    UploadID:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per logical command; reusing a key with different content conflicts.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag returned for the current aggregate version.
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  responses:
    Problem:
      description: Safe typed problem; detail excludes secrets and raw provider content.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: live }
    Readiness:
      type: object
      additionalProperties: false
      required: [status, role, dependencies]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        role: { $ref: '#/components/schemas/RuntimeRole' }
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ready, degraded, unavailable]
    Startup:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [starting, complete, failed] }
    Version:
      type: object
      additionalProperties: false
      required: [service, role, version, schema_version]
      properties:
        service: { type: string, const: keel }
        role: { $ref: '#/components/schemas/RuntimeRole' }
        version: { type: string, minLength: 1, maxLength: 128 }
        source_sha: { type: string, pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$' }
        artifact_digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        schema_version: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
    RuntimeRole:
      type: string
      enum: [api, relay, projector, ai-executor, temporal-worker, webhook-worker, billing-worker, notification-worker]
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [external_reference, supplier_id, currency, amount_minor, line_items]
      properties:
        external_reference: { type: string, minLength: 1, maxLength: 128 }
        supplier_id: { type: string, format: uuid }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Three uppercase letters; the server validates the supported ISO 4217 currency catalog before mutation.
        amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        line_items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [description, quantity]
            properties:
              description: { type: string, minLength: 1, maxLength: 500 }
              quantity:
                type: string
                maxLength: 32
                pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
                not:
                  pattern: '^0(\.0{1,6})?$'
        evidence:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [document_id, version]
            properties:
              document_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [evidence]
      properties:
        evidence:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [document_id, version]
            properties:
              document_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    Order:
      type: object
      additionalProperties: false
      required: [order_id, status, version, external_reference, supplier_id, currency, amount_minor, line_items, projection_watermark, projection_lag_versions, updated_at]
      properties:
        order_id: { type: string, format: uuid }
        status:
          type: string
          enum: [draft, submitted, verifying, approved, rejected, canceled]
          description: Authoritative state from the transactional command snapshot.
        version: { type: integer, format: int64, minimum: 1, description: Authoritative command aggregate version. }
        external_reference: { type: string, minLength: 1, maxLength: 128 }
        supplier_id: { type: string, format: uuid }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Three uppercase letters; the server validates the supported ISO 4217 currency catalog before mutation.
        amount_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        line_items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [description, quantity]
            properties:
              description: { type: string, minLength: 1, maxLength: 500 }
              quantity:
                type: string
                maxLength: 32
                pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
                not: { pattern: '^0(\.0{1,6})?$' }
        projection_watermark: { type: integer, format: int64, minimum: 0, description: Highest contiguous version applied by the asynchronous read projection; zero means no projection is available yet. }
        projection_lag_versions: { type: integer, format: int64, minimum: 0, description: Authoritative version minus projection watermark. }
        updated_at: { type: string, format: date-time }
    IssueSupplierInvitationRequest:
      type: object
      additionalProperties: false
      required: [case_id, supplier_id, recipient_email]
      properties:
        case_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        recipient_email: { type: string, format: email, maxLength: 254, writeOnly: true }
    IssueSupplierInvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation_id, expires_at, invitation_token]
      properties:
        invitation_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        invitation_token: { type: string, format: password, minLength: 40, maxLength: 64, writeOnly: true }
    AcceptSupplierInvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation_id, case_id, supplier_id, upload_session_token]
      properties:
        invitation_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        upload_session_token: { type: string, format: password, minLength: 40, maxLength: 64, writeOnly: true }
    CreateSupplierUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename: { type: string, minLength: 1, maxLength: 160, writeOnly: true }
        content_type:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain]
        size_bytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    CreateSupplierUploadResponse:
      type: object
      additionalProperties: false
      required: [upload_id, state, capability_expires_at, upload_capability, content_url]
      properties:
        upload_id: { type: string, format: uuid }
        state: { type: string, const: awaiting_upload }
        capability_expires_at: { type: string, format: date-time }
        upload_capability: { type: string, format: password, minLength: 40, maxLength: 2048, writeOnly: true }
        content_url: { type: string, format: uri-reference }
    RenewSupplierUploadCapabilityResponse:
      type: object
      additionalProperties: false
      required: [upload_id, upload_capability, capability_expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        upload_capability: { type: string, format: password, minLength: 40, maxLength: 2048, writeOnly: true }
        capability_expires_at: { type: string, format: date-time }
    SupplierUploadStatus:
      type: object
      additionalProperties: false
      required: [upload_id, state, updated_at]
      properties:
        upload_id: { type: string, format: uuid }
        state: { type: string, enum: [awaiting_upload, processing, ready, rejected, expired] }
        updated_at: { type: string, format: date-time }
    OrderEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderHistoryEvent'
        next_cursor: { type: string, minLength: 1, maxLength: 2048 }
    OrderHistoryEvent:
      type: object
      additionalProperties: false
      required: [event_id, version, type, occurred_at]
      properties:
        event_id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        type:
          type: string
          enum: [order.created, order.submitted, order.verification_started, order.approved, order.rejected, order.canceled]
        occurred_at: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1, maxLength: 128 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, minLength: 1, maxLength: 64 }
        detail: { type: string, maxLength: 1024 }
        request_id: { type: string, format: uuid }
        retry_after_seconds: { type: integer, minimum: 0, maximum: 86400 }
