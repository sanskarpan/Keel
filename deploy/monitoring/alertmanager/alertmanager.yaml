# Local Alertmanager routing for Keel webhook alerts (UNQUALIFIED).
#
# PagerDuty was removed as a dependency: both receivers post to a generic webhook URL
# that the operator points at any free endpoint (Slack/Discord/custom receiver). Until
# the URL is set to something real, notifications fail closed with connection errors in
# the Alertmanager log and no alert is lost silently: firing state stays visible in the
# Alertmanager UI and inhibition still applies. Grouping uses only the fixed
# service/component/alertname labels, matching the content-free metrics contract.
global:
  resolve_timeout: 5m

route:
  receiver: keel-warning-ops
  group_by: [service, component, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "critical"]
      receiver: keel-critical-ops
      group_wait: 10s
      repeat_interval: 30m
      continue: false

receivers:
  - name: keel-critical-ops
    webhook_configs:
      - url: http://127.0.0.1:19094/hooks/ops-alerts
        send_resolved: true
        http_config:
          follow_redirects: false
  - name: keel-warning-ops
    webhook_configs:
      - url: http://127.0.0.1:19094/hooks/ops-alerts
        send_resolved: true
        http_config:
          follow_redirects: false

inhibit_rules:
  # A down worker makes every warning derived from its gauges noise.
  - source_matchers: [alertname = "KeelWebhookWorkerDown", severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [service, component]
